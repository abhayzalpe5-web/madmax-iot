services:
  - type: web
    name: madmax-iot
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm rebuild sqlite3 --build-from-source
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
